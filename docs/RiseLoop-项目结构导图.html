<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rise Loop 项目结构</title>
<style>
  :root {
    --bg: #fbfdf9;
    --panel: #eff6f1;
    --ink: #191c1a;
    --muted: #404944;
    --line: #bfc9c2;
    --arrow: #707973;
    --accent: #006c4d;
    --engine: #3e6374;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191c1a;
      --panel: #1d2521;
      --ink: #e1e3df;
      --muted: #bfc9c2;
      --line: #404944;
      --arrow: #8a938d;
      --accent: #6bdbad;
      --engine: #a5ccdf;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 48px; }
  svg { display: block; width: 100%; height: auto; }
  .t1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .t2 { font-size: 13px; fill: var(--muted); }
  .lane { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: var(--muted); }
  .h { font-size: 15px; font-weight: 600; }
  .p { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 10px; fill: var(--muted); }
  .d { font-size: 11.5px; fill: var(--muted); }
  .box rect { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  .box text { pointer-events: none; }
  .dashed rect { stroke-dasharray: 5 4; }
  .accent rect { stroke: var(--accent); }
  .engine rect { stroke: var(--engine); }
  .line { stroke: var(--arrow); stroke-width: 1.4; fill: none; }
  .ghost { stroke: var(--arrow); stroke-width: 1.2; fill: none; stroke-dasharray: 4 5; }
  .divider { stroke: var(--line); stroke-width: 1; }
  .note { font-size: 11px; fill: var(--muted); }
  .legend { font-size: 11px; fill: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1200 920" role="img" aria-labelledby="docTitle docDesc">
  <title id="docTitle">Rise Loop 项目结构</title>
  <desc id="docDesc">客户端、接入层、服务层、纯逻辑、云适配与华为云服务的运行时依赖，右侧为训练、独立资产与部署。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--arrow)" />
    </marker>
  </defs>

  <text class="t1" x="48" y="52">Rise Loop 项目结构</text>
  <text class="t2" x="48" y="78">仓库模块和运行时依赖</text>
  <line class="divider" x1="860" y1="104" x2="860" y2="892" />

  <!-- 客户端 -->
  <text class="lane" x="48" y="120">客户端</text>
  <g class="box">
    <rect x="48" y="134" width="368" height="98" rx="14" />
    <text class="h" x="72" y="168">Vue 3 界面</text>
    <text class="p" x="72" y="190">apps/desktop-tauri/src</text>
    <text class="d" x="72" y="212">评估、干预卡、周报、问答、训练采集</text>
  </g>
  <g class="box">
    <rect x="444" y="134" width="336" height="98" rx="14" />
    <text class="h" x="468" y="168">Rust 原生层</text>
    <text class="p" x="468" y="190">apps/desktop-tauri/src-tauri</text>
    <text class="d" x="468" y="212">计时、托盘、通知、训练采集，令牌放 Keychain</text>
  </g>
  <line class="line" x1="416" y1="183" x2="444" y2="183" marker-start="url(#arrow)" marker-end="url(#arrow)" />

  <!-- 通道 -->
  <text class="lane" x="48" y="262">通道</text>
  <g class="box">
    <rect x="150" y="272" width="528" height="84" rx="14" />
    <text class="h" x="174" y="304">api-client</text>
    <text class="p" x="174" y="324">packages/api-client</text>
    <text class="d" x="174" y="344">统一请求，令牌经 IPC 从 Keychain 取</text>
  </g>
  <line class="line" x1="232" y1="232" x2="232" y2="272" marker-end="url(#arrow)" />
  <line class="line" x1="612" y1="232" x2="612" y2="272" marker-end="url(#arrow)" />

  <!-- 云端接入 -->
  <text class="lane" x="48" y="392">云端</text>
  <g class="box accent">
    <rect x="150" y="398" width="528" height="84" rx="14" />
    <text class="h" x="174" y="430">cloud-api 接入层</text>
    <text class="p" x="174" y="450">app/api、app/core</text>
    <text class="d" x="174" y="470">JWT 鉴权、限流、safety-check</text>
  </g>
  <line class="line" x1="414" y1="356" x2="414" y2="398" marker-end="url(#arrow)" />
  <text class="note" x="424" y="382">HTTPS</text>

  <g class="box">
    <rect x="150" y="512" width="528" height="84" rx="14" />
    <text class="h" x="174" y="544">服务层</text>
    <text class="p" x="174" y="564">app/services</text>
    <text class="d" x="174" y="584">评估、心跳、反馈、姿态、周报、问答</text>
  </g>
  <line class="line" x1="414" y1="482" x2="414" y2="512" marker-end="url(#arrow)" />

  <g class="box engine">
    <rect x="150" y="626" width="250" height="84" rx="14" />
    <text class="h" x="174" y="658">状态机 + 风险</text>
    <text class="p" x="174" y="678">packages/intervention-engine</text>
    <text class="d" x="174" y="699">纯函数，不碰网络和数据库</text>
  </g>
  <g class="box">
    <rect x="428" y="626" width="250" height="84" rx="14" />
    <text class="h" x="452" y="658">云适配层</text>
    <text class="p" x="452" y="678">app/cloud</text>
    <text class="d" x="452" y="699">RDS、DCS、ModelArts、OBS、KMS</text>
  </g>
  <line class="line" x1="275" y1="596" x2="275" y2="626" marker-end="url(#arrow)" />
  <line class="line" x1="553" y1="596" x2="553" y2="626" marker-end="url(#arrow)" />

  <!-- 华为云 -->
  <text class="lane" x="48" y="744">华为云</text>
  <g class="box">
    <rect x="48" y="758" width="240" height="96" rx="14" />
    <text class="h" x="72" y="790">RDS for PostgreSQL</text>
    <text class="d" x="72" y="814">事实数据</text>
    <text class="d" x="72" y="834">评估、迁移、执行、安全事件</text>
  </g>
  <g class="box">
    <rect x="316" y="758" width="240" height="96" rx="14" />
    <text class="h" x="340" y="790">DCS for Redis</text>
    <text class="d" x="340" y="814">实时状态</text>
    <text class="d" x="340" y="834">会话、计时、待响应干预</text>
  </g>
  <g class="box">
    <rect x="584" y="758" width="244" height="106" rx="14" />
    <text class="h" x="608" y="782">ModelArts</text>
    <text class="d" x="608" y="802">在线推理 · 5 特征 → 四分类</text>
    <text class="d" x="608" y="820">只要求头肩入画</text>
    <text class="d" x="608" y="838">训练 scripts/modelarts</text>
    <text class="d" x="608" y="856">reports/v1 · endpoint 待开通</text>
  </g>
  <path class="line" d="M553 710 V736" />
  <path class="line" d="M168 736 H706" />
  <line class="line" x1="168" y1="736" x2="168" y2="758" marker-end="url(#arrow)" />
  <line class="line" x1="436" y1="736" x2="436" y2="758" marker-end="url(#arrow)" />
  <line class="line" x1="706" y1="736" x2="706" y2="758" marker-end="url(#arrow)" />

  <!-- 图例 -->
  <line class="line" x1="48" y1="892" x2="88" y2="892" />
  <text class="legend" x="98" y="896">运行时链路</text>
  <line class="ghost" x1="200" y1="892" x2="240" y2="892" />
  <text class="legend" x="250" y="896">可选资产</text>

  <!-- 右侧：训练 -->
  <text class="lane" x="884" y="120">训练</text>
  <g class="box">
    <rect x="884" y="134" width="268" height="116" rx="14" />
    <text class="h" x="908" y="168">ModelArts 训练</text>
    <text class="p" x="908" y="190">scripts/modelarts</text>
    <text class="d" x="908" y="214">采集 → 校验 → 训练 → 评估</text>
    <text class="d" x="908" y="234">报告 reports/v1</text>
  </g>

  <!-- 右侧：独立资产 -->
  <text class="lane" x="884" y="274">独立资产</text>
  <g class="box dashed">
    <rect x="884" y="288" width="268" height="92" rx="14" />
    <text class="h" x="908" y="320">MCP Server ×2</text>
    <text class="p" x="908" y="342">services/mcp-servers</text>
    <text class="d" x="908" y="364">固定 3 个工具</text>
  </g>
  <g class="box dashed">
    <rect x="884" y="396" width="268" height="92" rx="14" />
    <text class="h" x="908" y="428">Skill ×4</text>
    <text class="p" x="908" y="450">services/skills</text>
    <text class="d" x="908" y="472">四个 SKILL.md</text>
  </g>
  <g class="box dashed">
    <rect x="884" y="504" width="268" height="92" rx="14" />
    <text class="h" x="908" y="536">Agent 编排（可选）</text>
    <text class="p" x="908" y="558">services/agent-orchestrator</text>
    <text class="d" x="908" y="580">不进核心决策</text>
  </g>

  <!-- 右侧：数据与部署 -->
  <text class="lane" x="884" y="620">数据</text>
  <g class="box">
    <rect x="884" y="634" width="268" height="92" rx="14" />
    <text class="h" x="908" y="666">data/</text>
    <text class="d" x="908" y="688">15 条动作，39 条证据</text>
    <text class="d" x="908" y="708">8 条问答语料</text>
  </g>

  <text class="lane" x="884" y="750">部署</text>
  <g class="box">
    <rect x="884" y="764" width="268" height="102" rx="14" />
    <text class="h" x="908" y="796">infra/</text>
    <text class="p" x="908" y="818">docker + huawei-cloud</text>
    <text class="d" x="908" y="840">镜像含状态机与动作库</text>
    <text class="d" x="908" y="860">smoke.py 验公网；缺 RDS 不启动</text>
  </g>
</svg>
</div>
</body>
</html>

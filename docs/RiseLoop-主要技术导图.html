<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Rise Loop 主要技术</title>
<style>
  :root {
    --bg: #f6f4f0;
    --panel: #ffffff;
    --ink: #191817;
    --muted: #6d6862;
    --line: #d8d2c8;
    --arrow: #9a938a;
    --accent: #2f5fd0;
    --engine: #2f6f4e;
    --danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131211;
      --panel: #1c1b1a;
      --ink: #f1eeea;
      --muted: #a09a92;
      --line: #3a3733;
      --arrow: #7d776f;
      --accent: #8fb0ff;
      --engine: #86c7a6;
      --danger: #ffb4ab;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 32px 24px 48px; }
  svg { display: block; width: 100%; height: auto; }
  .t1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .t2 { font-size: 13px; fill: var(--muted); }
  .h { font-size: 16px; font-weight: 600; }
  .p { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 10.5px; fill: var(--muted); }
  .d { font-size: 12px; fill: var(--muted); }
  .num { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 10.5px; fill: var(--arrow); }
  .ct { font-size: 13.5px; font-weight: 600; }
  .row-k { font-family: "JetBrains Mono", Consolas, "Courier New", monospace; font-size: 9.5px; fill: var(--muted); }
  .row-v { font-size: 11.5px; fill: var(--ink); }
  .chain { font-size: 11.5px; fill: var(--ink); }
  .b { font-size: 11.5px; fill: var(--muted); }
  .box rect { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  .box text { pointer-events: none; }
  .engine rect { stroke: var(--engine); }
  .danger rect { stroke: var(--danger); }
  .line { stroke: var(--arrow); stroke-width: 1.4; fill: none; }
  .loop { stroke: var(--arrow); stroke-width: 1.4; fill: none; }
  .divider { stroke: var(--line); stroke-width: 1; }
  .note { font-size: 10.5px; fill: var(--muted); }
  .legend { font-size: 11px; fill: var(--muted); }
  .sub { font-size: 10px; fill: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1200 1000" role="img" aria-labelledby="docTitle docDesc">
  <title id="docTitle">Rise Loop 主要技术</title>
  <desc id="docDesc">一次干预的完整链路：评估、久坐计时、触发判定、安全闸、动作匹配、执行、反馈、状态迁移，右侧为分层技术栈、姿态旁路、数据分工与运行边界。</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="var(--arrow)" />
    </marker>
  </defs>

  <text class="t1" x="48" y="52">Rise Loop 主要技术</text>
  <text class="t2" x="48" y="78">一轮干预从评估到迁移</text>
  <line class="divider" x1="656" y1="104" x2="656" y2="940" />

  <!-- 01 评估 -->
  <text class="num" x="48" y="150">01</text>
  <g class="box">
    <rect x="100" y="116" width="500" height="84" rx="14" />
    <text class="h" x="126" y="150">最小评估</text>
    <text class="p" x="126" y="173">POST /assessment</text>
    <text class="d" x="126" y="189">填部位、疼痛评分和可用时间，定下初始状态</text>
  </g>

  <!-- 02 计时 -->
  <text class="num" x="48" y="254">02</text>
  <g class="box">
    <rect x="100" y="220" width="500" height="84" rx="14" />
    <text class="h" x="126" y="254">久坐计时</text>
    <text class="p" x="126" y="277">Rust 前台计时 → POST /sitting/heartbeat</text>
    <text class="d" x="126" y="293">默认 45 分钟触发，可在 30–60 之间调</text>
  </g>

  <!-- 03 触发 -->
  <text class="num" x="48" y="358">03</text>
  <g class="box">
    <rect x="100" y="324" width="500" height="84" rx="14" />
    <text class="h" x="126" y="358">触发判定</text>
    <text class="p" x="126" y="381">读 Redis 里的实时状态</text>
    <text class="d" x="126" y="397">十分钟内推过就不再推，避免连着打扰</text>
  </g>

  <!-- 04 安全 -->
  <text class="num" x="48" y="462">04</text>
  <g class="box danger">
    <rect x="100" y="428" width="500" height="84" rx="14" />
    <text class="h" x="126" y="462">安全闸</text>
    <text class="p" x="126" y="485">safety-check 中间件（强制）</text>
    <text class="d" x="126" y="501">八类红旗命中就停推，直接返回就医提示</text>
  </g>

  <!-- 05 动作 -->
  <text class="num" x="48" y="566">05</text>
  <g class="box">
    <rect x="100" y="532" width="500" height="84" rx="14" />
    <text class="h" x="126" y="566">动作匹配</text>
    <text class="p" x="126" y="589">data/actions，15 条</text>
    <text class="d" x="126" y="605">按状态和部位挑动作，S2 一轮连做 2–3 条</text>
  </g>

  <!-- 06 执行 -->
  <text class="num" x="48" y="670">06</text>
  <g class="box">
    <rect x="100" y="636" width="500" height="84" rx="14" />
    <text class="h" x="126" y="670">执行</text>
    <text class="p" x="126" y="693">端侧倒计时 + 系统原生通知</text>
    <text class="d" x="126" y="709">画面不出本机，只上传 33 个关键点和 6 个特征</text>
  </g>

  <!-- 07 反馈 -->
  <text class="num" x="48" y="774">07</text>
  <g class="box">
    <rect x="100" y="740" width="500" height="84" rx="14" />
    <text class="h" x="126" y="774">反馈</text>
    <text class="p" x="126" y="797">POST /intervention/feedback</text>
    <text class="d" x="126" y="813">记下完成度、感受、疼痛评分和没做的原因</text>
  </g>

  <!-- 08 迁移 -->
  <text class="num" x="48" y="878">08</text>
  <g class="box engine">
    <rect x="100" y="844" width="500" height="84" rx="14" />
    <text class="h" x="126" y="878">状态迁移与落库</text>
    <text class="p" x="126" y="901">intervention-engine 纯函数</text>
    <text class="d" x="126" y="917">迁移历史写 RDS，实时状态回写 Redis</text>
  </g>

  <line class="line" x1="350" y1="200" x2="350" y2="220" marker-end="url(#arrow)" />
  <line class="line" x1="350" y1="304" x2="350" y2="324" marker-end="url(#arrow)" />
  <line class="line" x1="350" y1="408" x2="350" y2="428" marker-end="url(#arrow)" />
  <line class="line" x1="350" y1="512" x2="350" y2="532" marker-end="url(#arrow)" />
  <line class="line" x1="350" y1="616" x2="350" y2="636" marker-end="url(#arrow)" />
  <line class="line" x1="350" y1="720" x2="350" y2="740" marker-end="url(#arrow)" />
  <line class="line" x1="350" y1="824" x2="350" y2="844" marker-end="url(#arrow)" />

  <path class="loop" d="M600 886 H620 V262 H600" marker-end="url(#arrow)" />
  <text class="note" transform="translate(648 560) rotate(-90)" text-anchor="middle">下一轮久坐计时</text>

  <!-- 右侧：分层技术栈 -->
  <g class="box">
    <rect x="676" y="116" width="476" height="208" rx="14" />
    <text class="ct" x="700" y="148">分层技术栈</text>
  </g>
  <text class="row-k" x="700" y="178">界面</text>
  <text class="row-v" x="780" y="178">Vue 3，Composition API</text>
  <text class="row-k" x="700" y="205">原生</text>
  <text class="row-v" x="780" y="205">Tauri 2 + Rust，管计时、托盘和通知</text>
  <text class="row-k" x="700" y="232">契约</text>
  <text class="row-v" x="780" y="232">OpenAPI 生成 api-client 类型</text>
  <text class="row-k" x="700" y="259">服务</text>
  <text class="row-v" x="780" y="259">FastAPI + Pydantic v2 + SQLAlchemy</text>
  <text class="row-k" x="700" y="286">决策</text>
  <text class="row-v" x="780" y="286">intervention-engine，纯函数</text>
  <text class="row-k" x="700" y="313">云适配</text>
  <text class="row-v" x="780" y="313">app/cloud，mock 和 huawei 双模式</text>

  <!-- 右侧：姿态旁路 -->
  <g class="box">
    <rect x="676" y="344" width="476" height="176" rx="14" />
    <text class="ct" x="700" y="376">姿态旁路</text>
  </g>
  <text class="chain" x="700" y="410">摄像头 → MediaPipe Pose 33 点</text>
  <text class="chain" x="700" y="432">→ 6 个派生特征 → MLP v0 四分类</text>
  <circle cx="706" cy="462" r="2.2" fill="var(--arrow)" />
  <text class="b" x="718" y="466">置信度 &lt; 0.5 判 undetermined；画面不出本机</text>
  <circle cx="706" cy="486" r="2.2" fill="var(--arrow)" />
  <text class="b" x="718" y="490">合成数据 test macro-F1 0.9546，非真实准确率</text>
  <circle cx="706" cy="510" r="2.2" fill="var(--arrow)" />
  <text class="b" x="718" y="514">ModelArts endpoint 待开通；超时 503 降级</text>

  <!-- 右侧：数据分工 -->
  <g class="box">
    <rect x="676" y="540" width="476" height="164" rx="14" />
    <text class="ct" x="700" y="572">数据分工</text>
  </g>
  <text class="row-v" x="700" y="602" font-weight="600">RDS for PostgreSQL</text>
  <text class="sub" x="700" y="622">事实数据</text>
  <text class="b" x="700" y="648">评估、迁移、执行、安全事件</text>
  <text class="b" x="700" y="670">周报与问答日志</text>
  <text class="row-v" x="932" y="602" font-weight="600">DCS for Redis</text>
  <text class="sub" x="932" y="622">实时状态</text>
  <text class="b" x="932" y="648">会话、久坐计时</text>
  <text class="b" x="932" y="670">待响应干预、安全短缓存</text>

  <!-- 右侧：运行边界 -->
  <g class="box">
    <rect x="676" y="724" width="476" height="192" rx="14" />
    <text class="ct" x="700" y="756">运行边界</text>
  </g>
  <circle cx="706" cy="786" r="2.2" fill="var(--arrow)" />
  <text class="b" x="718" y="790">云端和本地由用户选，不会自动切换</text>
  <circle cx="706" cy="822" r="2.2" fill="var(--arrow)" />
  <text class="b" x="718" y="826">两个引擎规则一致，靠跨语言对拍守住</text>
  <circle cx="706" cy="858" r="2.2" fill="var(--arrow)" />
  <text class="b" x="718" y="862">云端模式下，端侧不碰迁移</text>
  <circle cx="706" cy="894" r="2.2" fill="var(--arrow)" />
  <text class="b" x="718" y="898">CodeArts 只在研发阶段用</text>

  <!-- 图例 -->
  <line class="line" x1="48" y1="966" x2="88" y2="966" marker-end="url(#arrow)" />
  <text class="legend" x="98" y="970">主链路</text>
  <text class="legend" x="168" y="970">一轮结束回到久坐计时，等待下一次阈值触发</text>
</svg>
</div>
</body>
</html>

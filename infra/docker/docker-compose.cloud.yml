name: riseloop-cloud

services:
  postgres:
    image: postgres:16-alpine
    container_name: riseloop-postgres
    environment:
      POSTGRES_USER: riseloop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riseloop}
      POSTGRES_DB: riseloop
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riseloop -d riseloop"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: riseloop-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  api:
    build:
      context: ../../apps/cloud-api
    container_name: riseloop-api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

[package]
name = "rise-loop"
version = "0.1.0"
description = "Rise Loop desktop client"
authors = ["Rise Loop Team"]
edition = "2024"

[lib]
name = "rise_loop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

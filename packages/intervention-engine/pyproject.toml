[project]
name = "riseloop-intervention-engine"
version = "0.1.0"
description = "Rise Loop four-state intervention state machine (pure functions)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
[project]
name = "sitloop-mcp-servers"
version = "0.1.0"
description = "SitLoop MCP servers: exactly 3 tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
